<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>GTA VI Boosters</title>
  <meta name="description" content="Ouvre des boosters de 3 cartes et complète ta collection. Fan-made, non affilié à Rockstar Games." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎴</text></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="grain"></div>
  <div id="screenFlash" class="screen-flash"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-badge">VI</span>
      <span class="brand-name">Booster<span class="highlight">Club</span></span>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab-btn active" data-tab="boosters" role="tab" aria-selected="true">🎁 Boosters</button>
      <button class="tab-btn" data-tab="collection" role="tab" aria-selected="false">📖 Collection</button>
    </nav>
  </header>

  <p class="disclaimer">Projet de fan non officiel, sans lien avec Rockstar Games ni Take-Two Interactive. Cartes et visuels 100% originaux.</p>

  <main>
    <section id="tab-boosters" class="tab-panel active">
      <div class="booster-stage">
        <div id="boosterPack" class="booster-pack" role="button" aria-label="Ouvrir un booster" tabindex="0"></div>

        <button id="openBtn" class="open-btn">Ouvrir un booster</button>
        <p id="pityHint" class="pity-hint"></p>

        <div id="cardsReveal" class="cards-reveal" hidden>
          <div class="card-slot" data-slot="0"><div class="card"><div class="card-back"></div><div class="card-front"></div></div></div>
          <div class="card-slot" data-slot="1"><div class="card"><div class="card-back"></div><div class="card-front"></div></div></div>
          <div class="card-slot" data-slot="2"><div class="card"><div class="card-back"></div><div class="card-front"></div></div></div>
        </div>

        <button id="revealAllBtn" class="reveal-all-btn" hidden>Tout révéler</button>
        <button id="againBtn" class="again-btn" hidden>Ouvrir un autre booster</button>
      </div>
    </section>

    <section id="tab-collection" class="tab-panel">
      <div class="collection-header">
        <h2>Ma collection</h2>
        <div class="progress-wrap">
          <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
          <p id="progressText" class="progress-text">0 / 0 cartes découvertes</p>
        </div>
        <div id="rarityFilters" class="rarity-filters"></div>
      </div>
      <div id="collectionGrid" class="collection-grid"></div>
    </section>
  </main>

  <footer class="footer">
    <p>Fait par un fan, pour des fans. 🎮</p>
  </footer>

  <div id="lightbox" class="lightbox" hidden>
    <div id="lightboxBackdrop" class="lightbox-backdrop"></div>
    <div class="lightbox-stage">
      <button id="lightboxClose" class="lightbox-close" aria-label="Fermer">✕</button>
      <div id="lightboxCard"></div>
    </div>
  </div>

  <script src="cards-data.js"></script>
  <script src="script.js"></script>
</body>
</html>
